[General]
# Pre-blurred wallpaper. Regenerate with ./render-bg.sh after changing the
# source wallpaper — the greeter runs as the `sddm` user and cannot read
# anything under /home, so the image must live inside the theme directory.
background=background.png

# LUMEN palette.
textColor=#f6f8fc
dimColor=#f6f8fc
prismCool=#ab9cff
prismWarm=#ffb38c
checkColor=#76ff58
failColor=#ff7a8c
capsColor=#ffce6e

fontDisplay=SF Pro Display
fontText=SF Pro Text

# QUIET BY DEFAULT: the password capsule is invisible until you type, exactly
# the old lock screen's `fade_on_empty` did. (Currently advisory: the dots
# simply are not there until you type.)
fadeOnEmpty=true
