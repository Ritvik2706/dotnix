# Heavy "max quality" mode — opt-in. Toggle at runtime with a keybind
# (apply-profile quality) for low-res content where neural upscaling helps.
[quality]
profile-desc="Max quality (heavy GPU)"
glsl-shaders="~~/shaders/FSRCNNX/FSRCNNX_x2_16-0-4-1.glsl,~~/shaders/SSim/SSimSuperRes.glsl,~~/shaders/SSim/SSimDownscaler.glsl"
scale=ewa_lanczossharp
cscale=spline64
interpolation=yes
tscale=sphinx
tscale-blur=0.6991556596428412
video-sync=display-resample
deband-threshold=48
deband-grain=32

[webtorrent-entries]
profile-cond=string.match(string.lower(string.gsub(require "mp.utils".join_path(get("working-directory", ""), get("path", "")), string.gsub(get("filename", ""), "([^%w])", "%%%1").."$", "")), "webtorrent")
profile-restore=copy-equal
script-opts-append=memo-enabled=no

[protocol.file]

[protocol-network]
cache=yes
demuxer-max-bytes=400MiB
demuxer-readahead-secs=600

[protocol.http]
profile=protocol-network

[protocol.https]
profile=protocol-network

[extension.gif]
loop-file=yes

[extension.png]

[extension.jpg]

[extension.jpeg]
