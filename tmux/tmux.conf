# ~/.config/tmux/tmux.conf
# Originally based on linkarzu's dotfiles, trimmed down and adapted.
# Used across all my devices (WSL/Linux), so keep everything portable.

# #############################################################################
# General options
# #############################################################################

# Prefix key
set -g prefix C-a

# tmux-256color + RGB override gives truecolor with no neovim
# `:checkhealth` warnings
set -g default-terminal "tmux-256color"
set -sg terminal-overrides ",*:RGB"

# Pass through cursor-shape (DECSCUSR) escapes so vi-mode's bar/block cursor
# works inside tmux. Without Ss/Se advertised, tmux swallows these and the
# cursor gets stuck as a block. Ss sets the shape, Se resets it.
# NOTE: must be SINGLE-quoted. In double quotes tmux's parser strips the
# backslash in "\E", leaving a literal "E" — so tmux emits "E[5 q" as visible
# ghost text instead of a real escape, and the cursor never changes shape.
set -sga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# Needed by image.nvim (and visual-activity off pairs with its
# tmux_show_only_in_active_window option)
set -gq allow-passthrough on
set -g visual-activity off

# Vim navigation in copy mode (search with /, v for visual mode, etc.)
set -g mode-keys vi

# Track focus events so (neo)vim autocmds react to pane focus changes
set-option -g focus-events on

# Scrollback
set-option -g history-limit 10000

# Windows start at 1 and renumber on close, so they always stay contiguous
# (matters for the prefix+u/i/o window shortcuts below)
set -g base-index 1
set -g renumber-windows on

# Switch to another session, if available, when the current session is destroyed
set -g detach-on-destroy off

# Mouse for resizing panes, scrolling, etc.
set -g mouse on

# Needed for osc52 clipboard (https://github.com/ojroques/nvim-osc52)
set -s set-clipboard on

# Recommended by neovim :checkhealth — delay after Escape before it's treated
# as a standalone keypress (default 500)
set-option -sg escape-time 10

# Pane borders: hairlines, like niri's glass rims; the active pane's is lit
set -g pane-border-lines single
set -g pane-active-border-style 'fg=#8b93a7,bg=default'
set -g pane-border-style 'fg=#232a38,bg=default'
set -g pane-border-indicators colour

# #############################################################################
# Keybindings
# #############################################################################

# Ghostty sends ^[[27;5;13~ for ctrl+enter outside tmux, but nothing inside
# it, so forward it manually (check with `/bin/cat -v`)
bind-key -n C-Enter send-keys "\e[27;5;13~"

# Reload this config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Splits open in the current pane's directory
unbind '|'
bind '|' split-window -h -c "#{pane_current_path}"
unbind '-'
bind - split-window -v -c "#{pane_current_path}"

# New windows too
bind c new-window -c "#{pane_current_path}"

# Windows 1-2 also have home-row shortcuts. Use prefix+1..9 for any window;
# prefix+o belongs to SessionX and prefix+p belongs to Floax.
unbind p
bind u select-window -t 1
bind i select-window -t 2
unbind o

# Previous window ('p' is taken above)
unbind m
bind m previous-window

# Toggle pane zoom
unbind M
bind -r M resize-pane -Z

# Resize panes by 1 cell, repeatable
bind -r Left resize-pane -L 1
bind -r Down resize-pane -D 1
bind -r Up resize-pane -U 1
bind -r Right resize-pane -R 1

# Toggle synchronize-panes
unbind Q
bind Q setw synchronize-panes \; display-message "Pane sync: #{?pane_synchronized,ON,OFF}"

# Layouts (Alt needs the terminal to send option/alt as meta)
bind M-j select-layout even-horizontal
bind M-k select-layout even-vertical
bind M-J select-layout main-horizontal
bind M-K select-layout main-vertical
# Custom saved layouts, see layouts/readme.md
bind M-l run-shell ~/.config/tmux/layouts/7030/apply_layout.sh
bind M-L run-shell ~/.config/tmux/layouts/2x3/apply_layout.sh
# Same as the M- variants but without alt, for terminals where alt is awkward
unbind J
unbind K
unbind C-j
unbind C-k
bind J select-layout even-horizontal
bind K select-layout even-vertical
bind C-j select-layout main-horizontal
bind C-k select-layout main-vertical

# Send a command to every pane/window in the current session...
# https://scripter.co/command-to-every-pane-window-session-in-tmux/
bind M-e command-prompt -p "Command:" \
  "run \"tmux list-panes -s -F '##{session_name}:##{window_index}.##{pane_index}' \
                | xargs -I PANE tmux send-keys -t PANE '%1' Enter\""
# ...or to every pane in every session
bind M-E command-prompt -p "Command:" \
  "run \"tmux list-panes -a -F '##{session_name}:##{window_index}.##{pane_index}' \
              | xargs -I PANE tmux send-keys -t PANE '%1' Enter\""

# -----------------------------------------------------------------------------
# Sessions
# -----------------------------------------------------------------------------

# Alternate session, like 'cd -' (-l = last session, see `man tmux`).
# Falls back to the session list when there's no last session yet (e.g. only
# one session exists), instead of erroring with "can't find last session".
unbind Space
bind-key Space if -F '#{client_last_session}' 'switch-client -l' 'choose-tree -Zs -O time'

# Session list (prefix+s) sorted by last use instead of by name, collapsed
bind s choose-tree -Zs -O time -F "#{session_windows}"

# In the choose-tree session list, 'd' kills the highlighted session and 'D'
# kills all tagged sessions (instead of the default x/X); outside tree-mode
# the keys pass through untouched
bind -n d if -F '#{==:#{pane_mode},tree-mode}' 'send x' 'send d'
bind -n D if -F '#{==:#{pane_mode},tree-mode}' 'send X' 'send D'

# fzf popup to jump to a session
# https://github.com/majjoha/dotfiles/blob/cd6f966d359e16b3a7c149f96d4edb8a83e769db/.config/tmux/tmux.conf#L41
bind M-s display-popup -E -w 75% -h 75% "\
  tmux list-sessions -F '#{?session_attached,,#{session_name}}' |\
  sed '/^$/d' |\
  fzf --reverse --header jump-to-session --preview 'tmux capture-pane -pt {}'  |\
  xargs tmux switch-client -t"

# fzf popup to kill sessions (multi-select with tab)
# https://www.youtube.com/watch?v=QWPyYx54JbE
bind M-S display-popup -E "\
    tmux list-sessions -F '#{?session_attached,,#{session_name}}' |\
    fzf --reverse -m --header=kill-session |\
    xargs -I {} tmux kill-session -t {}"

# sesh session picker (https://github.com/joshmedeski/sesh)
unbind T
bind-key f run-shell 'bash "$HOME/.config/tmux/tools/sesh-picker.sh"'

# -----------------------------------------------------------------------------
# Sessionizer (ThePrimeagen's script: pick a dir, get a session)
# -----------------------------------------------------------------------------

tmux_sessionizer="~/.config/tmux/tools/tmux-sessionizer.sh"

# Direct shortcuts to frequent dirs
# Avoid C-r (tmux-resurrect restore) and C-s (tmux-resurrect save)
unbind C-u
bind-key -r C-u run-shell "$tmux_sessionizer ~/.config"
unbind C-i
bind-key -r C-i run-shell "$tmux_sessionizer ~/github"
unbind C-y
bind-key -r C-y run-shell "$tmux_sessionizer ~/Downloads"
unbind C-h
bind-key -r C-h run-shell "$tmux_sessionizer ~"

# -----------------------------------------------------------------------------
# Copy mode
# -----------------------------------------------------------------------------

# Enter copy mode with prefix+v instead of prefix+[
unbind v
bind v copy-mode

# vim-style: Esc to exit, v to select, y to yank
bind-key -T copy-mode-vi 'Escape' send -X cancel
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

# gh/gl jump to beginning/end of line (g switches to a small custom key table
# so it can act as a leader)
unbind -T copy-mode-vi g
bind-key -T copy-mode-vi 'g' switch-client -T copy-mode-extended
bind-key -T copy-mode-extended 'h' send -X start-of-line \; switch-client -T copy-mode-vi
bind-key -T copy-mode-extended 'l' send -X end-of-line \; switch-client -T copy-mode-vi

# Don't exit copy mode when releasing a mouse drag
unbind -T copy-mode-vi MouseDragEnd1Pane

# Alt-t toggles the neovim terminal pane even from copy mode
bind-key -T copy-mode M-t run-shell "~/.config/tmux/tools/simple_toggle.sh"
bind-key -T copy-mode-vi M-t run-shell "~/.config/tmux/tools/simple_toggle.sh"

# #############################################################################
# Plugins (managed by tpm)
#   install: prefix+I   update: prefix+U   uninstall: remove line, prefix+alt+u
# #############################################################################

set -g @plugin 'tmux-plugins/tpm'

# Theme: glass, to sit inside niri's frosted windows next to the lumen
# island. No plugin: plain formats, the terminal's own translucent background
# everywhere (ghostty makes even cell backgrounds translucent, so pills are
# frosted chips like the island's). The current window is the lit chip, the
# session a quieter one, everything else dim text. One accent for zoom and
# pane sync. Default palette (the accent and the glass follow the wallpaper):
#   chip #3a4357 · quiet chip #2a3244 · text brightwhite · soft white
#   dim brightblack · rule #3a4152
# Colours the wallpaper re-tints (theme/wallpaper-theme.py writes
# ~/.cache/lumen/term/tmux.conf, sourced at the end, and re-sources it live).
# These are the defaults: eldritch magenta accent, navy glass.
set -g @t_accent '#fca6ff'
set -g @t_chip '#3a4357'
set -g @t_quiet '#2a3244'
set -g @t_rule '#3a4152'
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-left-length 60
set -g status-right-length 100
set -g status-style 'bg=default,fg=brightblack'

set -g status-left "#[fg=#{@t_quiet}]#[bg=#{@t_quiet},fg=white]#{s|.*/||:session_name}#[bg=default,fg=#{@t_quiet}]  "

set -g window-status-separator ''
# Pinned so nothing a plugin left on a running server (underline, coloured
# activity/bell blocks) leaks back in; activity and bell just brighten the name
set -g window-status-style default
set -g window-status-current-style default
set -g window-status-last-style default
set -g window-status-activity-style 'fg=white'
set -g window-status-bell-style 'fg=#fca6ff'
set -g window-status-format " #[fg=brightblack]#I #W "
set -g window-status-current-format "#[fg=#{@t_chip}]#[bg=#{@t_chip},fg=#{@t_accent}]#I#[fg=brightwhite] #W#{?window_zoomed_flag, #[fg=#{@t_accent}]󰁌,}#[bg=default,fg=#{@t_chip}]"

set -g status-right "#{?pane_synchronized,#[fg=#{@t_accent}]#[bg=#{@t_accent}#,fg=black#,bold]SYNC#[bg=default#,fg=#{@t_accent}#,nobold]  ,}"
set -ag status-right "#[fg=#{@t_accent}]#[fg=brightblack] #{?#{==:#{pane_current_path},$HOME},~,#{b:pane_current_path}}"
set -ag status-right " #[fg=#{@t_rule}]· #[fg=brightblack]#{pane_current_command} "

# Messages, the command prompt and copy-mode selection as the same soft pill
set -g message-style 'fg=brightwhite,bg=#2a3244'
set -g message-command-style 'fg=brightwhite,bg=#2a3244'
set -g mode-style 'fg=brightwhite,bg=#3a4357'

# Ctrl-hjkl pane navigation, shared with neovim (needs the matching
# vim-tmux-navigator plugin on the neovim side)
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'fcsonline/tmux-thumbs'
# Thumbs defaults to Space, which is reserved for switching sessions above.
set -g @thumbs-key 'F'
set -g @plugin 'sainnhe/tmux-fzf'

set -g @plugin 'wfxr/tmux-fzf-url'
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'o'
set -g @sessionx-x-path '~/github/config'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'
set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'

set -g @plugin 'omerxx/tmux-floax'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color '#3a4152'
set -g @floax-text-color 'white'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'

# Persist sessions across restarts
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Auto-save sessions (must be the last plugin)
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'off'
set -g @continuum-save-interval '5'

# All plugins live under ~/.config/tmux/plugins/ (gitignored)
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

# Bootstrap tpm on a fresh machine, then run it before final style overrides
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"
run '~/.config/tmux/plugins/tpm/tpm'

# Popups (fzf pickers, sessionx, url picker) as small rounded cards on the
# terminal's own background. Set AFTER TPM so no plugin overrides them.
set -g popup-style 'fg=default,bg=default'
set -g popup-border-style 'fg=#3a4152,bg=default'
set -g popup-border-lines rounded

# The wallpaper's tint, if the island has picked one
source-file -q ~/.cache/lumen/term/tmux.conf
