# Hypridle — reliable staged idle -> lock -> dpms off -> suspend

# Optional icon dir for notifications
#$iDIR="$HOME/.config/swaync/images/ja.png"

general {
    # Lock screen on demand or before sleep (only start hyprlock if not already running)
    lock_cmd = pidof hyprlock || hyprlock
    # Don’t kill hyprlock on unlock; let it exit cleanly
    # unlock_cmd = killall hyprlock

    # Make absolutely sure we’re locked before sleeping
    before_sleep_cmd = loginctl lock-session

    # Wake displays after resume (Hyprland sometimes needs a nudge), then nudge
    # hyprlock with a blank Enter so it kicks off a fresh PAM cycle (and thus a
    # fresh howdy face scan) the moment the lid reopens, instead of waiting for
    # a keypress.
    after_sleep_cmd = hyprctl dispatch dpms on && sleep 0.5 && wtype -k Return

    # IMPORTANT: ignore app inhibitors; otherwise a playing video can block suspend
    ignore_dbus_inhibit = true
}

# 1) Warn at 5 minutes
listener {
    timeout = 300  # 5 min
    on-timeout = notify-send -u low "💤 You seem idle" "Locking in 5 minutes if no activity."
    on-resume  = notify-send -u low "Welcome back!" "Idleness cancelled."
}

# 2) Lock at 10 minutes
listener {
    timeout = 600  # 10 min
    on-timeout = loginctl lock-session
    # on-resume = notify-send "Unlocked"
}

# 3) Turn off screens at 12 minutes (saves power; also keeps OLEDs safe)
#    Also pause the keyboard effect script (SIGUSR1) so the backlight goes
#    dark and razer-fx stops rendering; resume it on wake (SIGUSR2).
listener {
    timeout = 720  # 12 min
    on-timeout = hyprctl dispatch dpms off; kill -USR1 $(cat $XDG_RUNTIME_DIR/razer-fx.pid) 2>/dev/null
    on-resume  = hyprctl dispatch dpms on; kill -USR2 $(cat $XDG_RUNTIME_DIR/razer-fx.pid) 2>/dev/null
}

# 4) Suspend at 20 minutes
listener {
    timeout = 1200  # 20 min
    # If you prefer hybrid: systemctl suspend-then-hibernate
    on-timeout = systemctl suspend
    on-resume  = notify-send -u low "System resumed"
}

