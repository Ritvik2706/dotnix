# Hypridle — staged idle -> lock+blank -> suspend; see the notes on each stage

# Optional icon dir for notifications
#$iDIR="$HOME/.config/swaync/images/ja.png"

general {
    # Lock through the SUPERVISED unit, never by running hyprlock directly.
    # A bare `hyprlock &` is unsupervised: if it dies, nothing notices, and on
    # a machine that autologins that means a bare desktop. Going through
    # systemd means every lock — idle, lid, manual — gets the restart-on-crash
    # guarantee in system/systemd/hyprlock.service. `start` is idempotent, so
    # this is also the "only if not already running" check.
    lock_cmd = systemctl --user start hyprlock.service
    # Don’t kill hyprlock on unlock; let it exit cleanly (a clean exit is what
    # tells systemd this was an unlock and not a crash).
    # unlock_cmd = killall hyprlock

    # Make absolutely sure we’re locked before sleeping
    before_sleep_cmd = loginctl lock-session

    # Wake path — see hypr/scripts/resume-lock.sh for the full story. Short
    # version: a hyprlock that locked while the panel was off never renders a
    # frame, and since the unlock fades out through that same render path, it
    # can authenticate you and still never let you in. That is the lid-close
    # freeze. The script replaces that instance behind a dark backlight, so
    # the only thing you see is the new lock screen fading in.
    after_sleep_cmd = ~/.config/hypr/scripts/resume-lock.sh

    # IMPORTANT: ignore app inhibitors; otherwise a playing video can block suspend
    ignore_dbus_inhibit = true
}

# 1) Warn at 5 minutes
listener {
    timeout = 300  # 5 min
    on-timeout = notify-send -u low "💤 You seem idle" "Locking in 5 minutes if no activity."
    on-resume  = notify-send -u low "Welcome back!" "Idleness cancelled."
}

# 2) Lock AND blank at 10 minutes — one event, not two.
#
#    These used to be separate stages (lock at 10, screens off at 12), which
#    left a fully lit lock screen glowing at an empty room for two minutes.
#    Worse, hyprlock fires a PAM cycle the moment it locks, and howdy rides
#    that cycle — so walking away triggered a face scan at an empty chair.
#    The journal shows exactly that: a dozen "pam_howdy: Failure, timeout
#    reached" lines over three days, every one of them a camera scanning
#    nobody.
#
#    That first scan cannot be suppressed (hyprlock always authenticates on
#    lock, and there is no config for it), but it can be made cheap: blanking
#    in the same breath means it happens against a dark panel and is over in
#    `timeout` seconds. The scan that actually matters is on-resume, below.
#
#    razer-fx is paused here too (SIGUSR1), so the keyboard backlight goes
#    dark and it stops rendering; SIGUSR2 resumes it.
listener {
    timeout = 600  # 10 min
    on-timeout = loginctl lock-session; hyprctl dispatch dpms off; kill -USR1 $(cat $XDG_RUNTIME_DIR/razer-fx.pid) 2>/dev/null

    # THE HELLO MOMENT. You came back — wake the panel, wake the keyboard,
    # and hand the screen to a FRESH hyprlock, which runs a PAM cycle as it
    # locks and so has howdy look for you NOW, while you are in front of it.
    # Same script as after_sleep_cmd because it is the same failure: the
    # instance that has been sitting here rendered nothing while the panel
    # was dark, and may never render again. Replacing it is what unsticks it.
    on-resume  = ~/.config/hypr/scripts/resume-lock.sh
}

# 3) Suspend at 20 minutes
listener {
    timeout = 1200  # 20 min
    # If you prefer hybrid: systemctl suspend-then-hibernate
    on-timeout = systemctl suspend
    on-resume  = notify-send -u low "System resumed"
}
