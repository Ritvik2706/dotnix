# Hyprlock — "LUMEN"
#
# THIS IS THE ONLY AUTHENTICATION SURFACE ON THIS MACHINE.
#
# The session autologins (see sddm/autologin.sh) and this lock covers it
# before anything is drawn, so the screen you meet after a cold boot and the
# screen you meet after an idle timeout are not two themes kept in sync —
# they are literally the same program with the same config. SDDM's LUMEN
# theme is kept only as a fallback for the rare explicit logout.
#
# The trade that buys: the session starts BEFORE anyone authenticates.
# Autostarted apps are already running behind this lock. That is why the
# hardening below is not decorative — if hyprlock dies, the desktop is bare,
# so system/systemd/hyprlock.service restarts it on any abnormal exit and
# never gives up (StartLimitIntervalSec=0). Fail closed, always.
#
# DESIGN — ported from sddm/lumen/Main.qml, which is the reference:
#   · LIGHT IS THE MATERIAL — fills approach zero; nothing is boxed.
#   · QUIET BY DEFAULT — at rest the screen is wallpaper, greeting, time and
#     date. There is no control waiting to be used.
#   · THE ENTRY IS NOT A FIELD. No capsule, no plate, no rim — only the dots
#     of what you have typed, floating on the wallpaper. The input-field
#     below is present but drawn fully transparent; every visible pixel of it
#     is a dot.
#
# What does NOT port from the QML: the crest of light that travels along the
# dots while PAM works. hyprlock is hyprlang, not a scene graph, and has no
# per-dot animation. The composition is identical; that one motion is not.
#
# Palette (shared with waybar/style.css and sddm/lumen/theme.conf):
#   text  #f6f8fc   dim rgba(246,248,252,0.50)
#   prism cool #ab9cff (twilight) · warm #ffb38c (sunset)
#   state check/charge #76ff58 · fail/crit #ff7a8c · caps/warn #ffce6e

general {
    # Draw the background on the first frame instead of waiting on resources.
    # At boot this is the difference between meeting the lock screen and
    # meeting a black rectangle that becomes the lock screen.
    immediate_render = true
    hide_cursor = true

    # `grace`, `no_fade_in`, `no_fade_out` and `disable_loading_bar` are NOT
    # config options in hyprlock 0.9.6 — they are CLI flags only, and setting
    # them here made hyprlock print "config option does not exist" and ignore
    # the line on every start. `grace` matters: it is a window after locking
    # during which any keypress unlocks with NO authentication at all, and on
    # a machine that autologins that window is the whole security model. It
    # defaults to 0, but a default is not a guarantee — it is pinned
    # explicitly on the ExecStart line in system/systemd/hyprlock.service.
    # The loading bar is left at its default (on) — it is the only cue that
    # howdy is scanning, and PAM can sit for several seconds on a face scan.
    # FADE-IN, however, is turned off on the ExecStart line: hyprlock
    # cross-fades from a screencopy of the screen into the lock composition,
    # and on the wake path that screencopy is your desktop, so the fade reads
    # as "my unlocked desktop, dimmed, for a beat" — the one thing a lock
    # screen must never look like. With it off, and immediate_render above,
    # the first frame drawn is already the finished lock screen.

    # Don't let a failed unlock attempt leave the field in a state that eats
    # the next keystroke.
    #
    # ⚠ RECONSTRUCTED — the four blocks between here and the DATE label below
    # (the tail of `general`, BACKGROUND, GREETING, TIME) were lost when I ran
    # `git checkout` on this file and are rebuilt from the committed version
    # plus the surrounding style. Everything above and below this marker is
    # your text, restored verbatim. Check these values, then delete this note.
    fail_timeout = 500
    ignore_empty_input = false
}

# ── BACKGROUND ── the scene, pushed back. Enough blur and dim that luminous
# type reads as light sitting in front of depth, never as text on a photo.
background {
    monitor =
    path = /home/ritvik/github/config/dotnix/wallpapers/idk.png
    blur_passes = 3
    blur_size = 5
    contrast = 1.1
    brightness = 0.68
    vibrancy = 0.17
    vibrancy_darkness = 0.1
}

# ── GREETING ── content, not chrome. Time-aware, quiet, above the clock.
label {
    monitor =
    text = cmd[update:60000] echo "Good $(h=$(date +%H); if [ $h -lt 12 ]; then echo morning; elif [ $h -lt 18 ]; then echo afternoon; else echo evening; fi), Ritvik"
    color = rgba(246, 248, 252, 0.72)
    font_size = 17
    font_family = SF Pro Display Medium
    position = 0, 232
    halign = center
    valign = center
}

# ── TIME ── largest type on the screen; hierarchy is size, not colour.
label {
    monitor =
    text = cmd[update:1000] date +"%-H:%M"
    color = rgba(246, 248, 252, 0.96)
    font_size = 118
    font_family = SF Pro Display Bold
    position = 0, 150
    halign = center
    valign = center
}

# ── DATE ── quiet, dimmed, closing the upper block.
label {
    monitor =
    text = cmd[update:1000] date +"%A, %B %-d"
    color = rgba(246, 248, 252, 0.50)
    font_size = 19
    font_family = SF Pro Text
    position = 0, 42
    halign = center
    valign = center
}

# ── ENTRY ── there is no field. What you type IS the control.
#
# The input-field is drawn away to nothing — zero outline, transparent inner
# and outer — so the only thing it renders is its dots. Geometry is matched
# to the QML: a 40px-tall field with dots_size 0.225 gives 9px dots, and
# dots_spacing 0.67 puts a 6px gap between them, i.e. the QML's 9px dots on a
# 15px pitch.
#
# The state colours replace inner_color while they are active, so they are
# kept at very low alpha: a soft coloured wash blooming behind the dots
# rather than a capsule reappearing on every failure.
#
# HOWDY runs invisibly underneath. hyprlock starts a fresh PAM cycle — and
# therefore a fresh face scan — every time it locks AND every time Enter is
# pressed on an empty field, so a failed scan is retried by tapping Enter,
# with no visible UI needed to trigger it.
input-field {
    monitor =
    size = 320, 40
    rounding = -1
    outline_thickness = 0
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0)
    font_color = rgba(246, 248, 252, 0.94)

    dots_size = 0.225
    dots_spacing = 0.67
    dots_center = true
    dots_rounding = -1

    # Nothing at rest — the entry must not announce itself.
    fade_on_empty = true
    fade_timeout = 1200
    placeholder_text =
    hide_input = false

    # Soft washes, not fills. See the note above.
    check_color = rgba(118, 255, 88, 0.16)
    fail_color = rgba(255, 122, 140, 0.20)
    capslock_color = rgba(255, 206, 110, 0.16)
    fail_text = <span foreground="##ff7a8c">$FAIL ($ATTEMPTS)</span>

    position = 0, -78
    halign = center
    valign = center
}

# ── NOW PLAYING ── quiet, bottom-left. Only lights up when a player is live.
label {
    monitor =
    text = cmd[update:2000] timeout -k 1 2 ~/.config/hypr/scripts/songdetail.sh --title
    color = rgba(246, 248, 252, 0.62)
    font_size = 14
    font_family = SF Pro Text Semibold
    position = 28, 44
    halign = left
    valign = bottom
}
label {
    monitor =
    text = cmd[update:2000] timeout -k 1 2 ~/.config/hypr/scripts/songdetail.sh --artist
    color = rgba(246, 248, 252, 0.40)
    font_size = 12
    font_family = SF Pro Text
    position = 28, 24
    halign = left
    valign = bottom
}

# ── NETWORK ── quiet glyph, bottom-right, mirroring the greeter's corner
# cluster. (There is no session or user picker here: a lock screen has
# nothing to choose — you are already logged in.)
label {
    monitor =
    text = cmd[update:5000] timeout -k 1 2 ~/.config/hypr/scripts/network.sh
    color = rgba(246, 248, 252, 0.55)
    font_size = 16
    font_family = SF Pro Text
    position = -32, 32
    halign = right
    valign = bottom
}
