# Hyprlock — "LUMEN"
# The lock-screen sibling of the waybar theme (see waybar/style.css): a
# speculative read on Apple's design language ~4 years past Liquid Glass.
#   · LIGHT IS THE MATERIAL — fills approach zero; form is drawn by a luminous
#     rim and a chromatic dispersion at the bevel (cool violet on one edge,
#     warm peach on the other). That prism is the signature — and hyprlock can
#     render it natively as a gradient on the password ring's outer_color.
#   · QUIET BY DEFAULT — chrome nearly dissolves into the wallpaper; text sits
#     low-opacity until it matters. Hierarchy by size + light, never by fill.
#   · CONCENTRIC, LIQUID GEOMETRY — deep stadium radii, echoed inward.
#
# Palette (shared with LUMEN waybar):
#   text  #f6f8fc   dim rgba(246,248,252,0.50)
#   prism cool #ab9cff (twilight) · warm #ffb38c (sunset)  — dispersion pair
#   state check/charge #76ff58 · fail/crit #ff7a8c

general {
    immediate_render = true
    no_fade_in = false
    no_fade_out = false
    hide_cursor = false
    grace = 0
    disable_loading_bar = false
}

# BACKGROUND — the scene, pushed back behind frosted glass. Heavier blur + a
# gentle dim so the luminous UI reads as light sitting *in front of* the depth.
background {
    monitor =
    path = /home/ritvik/github/config/dotnix/wallpapers/idk.png
    blur_passes = 3
    blur_size = 5
    contrast = 1.1
    brightness = 0.68
    vibrancy = 0.17
    vibrancy_darkness = 0.1
}

# ── TIME ── largest type on the screen; hierarchy is size, not colour.
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-H:%M")"
    color = rgba(246, 248, 252, 0.96)
    font_size = 118
    font_family = SF Pro Display Bold
    position = 0, 150
    halign = center
    valign = center
}

# ── DATE ── quiet, dimmed, sitting just under the clock.
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %-d")"
    color = rgba(246, 248, 252, 0.50)
    font_size = 19
    font_family = SF Pro Text
    position = 0, 40
    halign = center
    valign = center
}

# ── GREETING ── content, not chrome, so it stays (Apple shows a greeting on
# the lock). Time-aware, quiet. This is the only thing besides clock + wallpaper
# present at rest — the field itself is hidden until you engage (see below).
label {
    monitor =
    text = cmd[update:60000] echo "Good $(h=$(date +%H); if [ $h -lt 12 ]; then echo morning; elif [ $h -lt 18 ]; then echo afternoon; else echo evening; fi), Ritvik"
    color = rgba(246, 248, 252, 0.72)
    font_size = 17
    font_family = SF Pro Display Medium
    position = 0, -332
    halign = center
    valign = center
}

# ── PASSWORD FIELD ── the LUMEN thesis, as behaviour.
# QUIET BY DEFAULT: fade_on_empty hides the whole capsule while empty, so at
# rest the screen is only wallpaper + clock + greeting — no painted control
# waiting to be used, exactly as Apple's lock discloses the entry only on
# intent. BLOOM ON ATTENTION: the instant you type, the frosted capsule fades
# in with a faint prism rim — cool violet splitting to warm peach. Because that
# dispersion ONLY ever appears while you're actively engaging, it reads as the
# glass catching light on attention, never as a decorative always-on ring.
input-field {
    monitor =
    size = 300, 54
    rounding = -1                 # full stadium — deepest concentric radius
    outline_thickness = 1
    # the prism, whispered — thin, low-opacity, and only seen mid-type
    outer_color = rgba(171, 156, 255, 0.40) rgba(255, 179, 140, 0.36) 110deg
    inner_color = rgba(246, 248, 252, 0.10)   # soft frosted glass fill
    font_color = rgba(246, 248, 252, 0.95)
    dots_size = 0.22
    dots_spacing = 0.42
    dots_center = true
    dots_rounding = -1
    # QUIET → BLOOM: capsule is invisible at rest, fades in on the first keypress
    # and back out shortly after the field empties. This is the reveal.
    fade_on_empty = true
    fade_timeout = 1200
    placeholder_text =            # nothing at rest — the field shouldn't announce itself
    hide_input = false
    check_color = rgba(118, 255, 88, 0.55)                     # charge green
    fail_color = rgba(255, 122, 140, 0.60)                     # crit coral
    fail_text = <span foreground="##ff7a8c">$FAIL ($ATTEMPTS)</span>
    fail_transition = 420           # LUMEN GLIDE — long, fluid arrival
    capslock_color = rgba(255, 206, 110, 0.60)                 # warn amber
    position = 0, -420
    halign = center
    valign = center
}

# ── NOW PLAYING ── quiet, bottom-left. Only lights up when a player is live.
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/songdetail.sh --title)"
    color = rgba(246, 248, 252, 0.62)
    font_size = 14
    font_family = SF Pro Text Semibold
    position = 28, 44
    halign = left
    valign = bottom
}
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/songdetail.sh --artist)"
    color = rgba(246, 248, 252, 0.40)
    font_size = 12
    font_family = SF Pro Text
    position = 28, 24
    halign = left
    valign = bottom
}

# ── NETWORK ── quiet glyph, bottom-right.
label {
    monitor =
    text = cmd[update:5000] echo "$(~/.config/hypr/scripts/network.sh)"
    color = rgba(246, 248, 252, 0.55)
    font_size = 16
    font_family = SF Pro Text
    position = -32, 32
    halign = right
    valign = bottom
}
