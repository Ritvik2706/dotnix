# Internal Razer Blade keyboard only; external keyboards pass through untouched
[ids]
1532:028a

[main]
# 3-way rotation: Win→Ctrl, Alt→Super, Ctrl→Alt
leftmeta = leftcontrol
rightmeta = rightcontrol
leftalt = leftmeta
rightalt = rightmeta
leftcontrol = leftalt
rightcontrol = rightalt

# ISO "<>" key (left of Z, next to left shift) → acts as shift
102nd = leftshift
