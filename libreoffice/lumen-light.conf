# ──────────────────────────────────────────────────────────────────────────
# LUMEN · LibreOffice — light-page delta
#
# Applied on top of lumen.conf by `apply.sh` (the default). Only the entries
# LibreOffice paints *onto the page* are re-stated here; the desk, the chrome
# and everything GTK owns stay exactly as lumen.conf left them.
#
# Why this exists: a dark page is only readable if "use automatic font colour
# for screen display" is on, and that switch repaints every glyph white by the
# *window* background — it cannot see a paragraph's or table cell's own fill.
# Any real-world .docx with light shading (headers, banded tables, callouts)
# then renders white-on-white. Turning the switch off instead leaves the very
# common "Automatic" black text invisible on the dark page. There is no third
# option: legible documents that carry their own colours need a light page.
#
# `apply.sh --dark-page` skips this file and restores the dark-page look.
# ──────────────────────────────────────────────────────────────────────────

# ── The sheet ──
# Paper is the Lumen text colour; it stays a touch off-white so it does not
# glare against the desk, which is still the dark #0c0d14 from lumen.conf.
DocColor  = #f6f8fc
FontColor = #1a1c26
Shadow    = #c3c8d6 visible

# ── Structural hairlines — same cool violet cast, inverted weight ──
DocBoundaries           = #c7cbdb
TableBoundaries         = #c7cbdb
WriterSectionBoundaries = #b9bed3
WriterTextGrid          = #d5d8e6

# ── Writer marks ──
WriterNonPrintChars = #9aa0b8
WriterFieldShadings = #e6e9f4 visible
WriterIdxShadings   = #eceef7 visible
WriterDirectCursor  = #6b4fd6 visible

# ── Links — the lilac accent darkened until it carries on paper ──
Links        = #5b3fd0 visible
LinksVisited = #7a5ea8 visible
SmartTags    = #5b3fd0

# ── Draw/Impress ──
DrawGrid = #d5d8e6 hidden

# ── Calc ──
CalcGrid                = #d5d8e6
CalcCellFocus           = #5b3fd0
CalcReference           = #5b3fd0
CalcNotesBackground     = #fff4d1
CalcProtectedBackground = #eef0f7
CalcValue               = #1c6f8c
CalcFormula             = #2c7a2c
CalcText                = #1a1c26

# ── Basic IDE ──
BASICEditor     = #f6f8fc
BASICIdentifier = #1a1c26
BASICNumber     = #b3610a
BASICString     = #2c7a2c
BASICOperator   = #b3400a
BASICKeyword    = #5b3fd0

# ── SQL (Base) ──
SQLIdentifier = #1a1c26
SQLNumber     = #b3610a
SQLString     = #2c7a2c
SQLOperator   = #b3400a
SQLKeyword    = #5b3fd0
SQLParameter  = #1c6f8c
