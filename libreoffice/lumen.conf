# ──────────────────────────────────────────────────────────────────────────
# LUMEN · LibreOffice — Application Colors
#
# The parts of LibreOffice that GTK cannot reach. Chrome (menus, toolbars,
# dialogs, scrollbars) is already dressed by ~/.config/gtk-3.0/gtk.css via the
# gtk3 VCL plugin; everything below is drawn by LibreOffice itself onto its own
# canvas, so it has to be told the palette explicitly.
#
# Palette (shared with waybar/style.css and vicinae/themes/lumen.toml):
#   text   #f6f8fc        muted #9aa0b8   placeholder #6a7090
#   prism  twilight #ab9cff  ·  sunset #ffb38c        (dispersion pair)
#   accent dusk-lilac #c2a8ff · coral #ff9e7a · cup-teal #5fb6cf
#   state  warn #ffce6e · crit #ff7a8c · charge #76ff58
#   base   desk #0c0d14 · page #0f1119 · raised #171826 · rim #2c2942
#
# Format:  Key = #rrggbb [visible|hidden]
# The optional third field maps to the entry's IsVisible flag; omit it for the
# entries that have no such flag. Lines starting with '#' are comments.
#
# NOTE: the chrome groups this schema also exposes (WindowColor, MenuColor,
# ButtonColor, FaceColor, AccentColor, …) are deliberately left unset. Setting
# them would have LibreOffice paint its own widgets and override the Lumen GTK
# glass — we want GTK to keep winning there.
# ──────────────────────────────────────────────────────────────────────────

# ── The page and the desk it floats on ──
# Page sits one step lighter than the desk so it reads as a lit sheet rather
# than a hole. FontColor is what "Automatic" text resolves to — it only takes
# effect together with the IsAutomaticFontColor switch that apply.sh sets.
DocColor        = #0f1119
AppBackground   = #0c0d14
FontColor       = #f6f8fc
Shadow          = #1e1a2e visible

# ── Structural hairlines — cool violet, never grey ──
DocBoundaries           = #2c2942
TableBoundaries         = #2c2942
WriterSectionBoundaries = #34304f
WriterTextGrid          = #2c2942

# ── Writer marks ──
# Non-printing characters stay at placeholder weight: present when you look
# for them, invisible when you're reading.
WriterNonPrintChars    = #6a7090
WriterHeaderFooterMark = #5fb6cf
WriterPageBreaks       = #ff9e7a
WriterDirectCursor     = #c2a8ff visible
WriterFieldShadings    = #1b1c2b visible
WriterIdxShadings      = #171826 visible

# ── Links and proofing squiggles ──
Links        = #c2a8ff visible
LinksVisited = #ab9cff visible
Spell        = #ff7a8c
Grammar      = #5fb6cf
SmartTags    = #c2a8ff

# ── Track-changes / comment authors — the Lumen accent wheel, in order ──
Author1 = #c2a8ff
Author2 = #ff9e7a
Author3 = #5fb6cf
Author4 = #ffce6e
Author5 = #ab9cff
Author6 = #ffb38c
Author7 = #76ff58
Author8 = #ff7a8c
Author9 = #9aa0b8

# ── Draw/Impress ──
DrawGrid = #2c2942 hidden

# ── Calc ──
# The scheme is global, so Calc inherits the dark DocColor whether or not we
# style it; these keep its grid and overlays legible on that ground.
CalcGrid                = #2c2942
CalcCellFocus           = #c2a8ff
CalcReference           = #c2a8ff
CalcPageBreak           = #ab9cff
CalcPageBreakManual     = #ff9e7a
CalcPageBreakAutomatic  = #5fb6cf
CalcHiddenColRow        = #5fb6cf visible
CalcTextOverflow        = #ff7a8c visible
CalcComments            = #ffce6e
CalcDetective           = #5fb6cf
CalcDetectiveError      = #ff7a8c
CalcNotesBackground     = #1a1c26
CalcProtectedBackground = #171a23
CalcValue               = #5fb6cf
CalcFormula             = #76ff58
CalcText                = #f6f8fc

# ── HTML source view ──
HTMLSGML    = #ab9cff
HTMLComment = #6a7090
HTMLKeyword = #c2a8ff
HTMLUnknown = #ff7a8c

# ── Basic IDE ──
BASICEditor     = #0f1119
BASICIdentifier = #f6f8fc
BASICComment    = #6a7090
BASICNumber     = #ffb38c
BASICString     = #76ff58
BASICOperator   = #ff9e7a
BASICKeyword    = #c2a8ff
BASICError      = #ff7a8c

# ── SQL (Base) ──
SQLIdentifier = #f6f8fc
SQLNumber     = #ffb38c
SQLString     = #76ff58
SQLOperator   = #ff9e7a
SQLKeyword    = #c2a8ff
SQLParameter  = #5fb6cf
SQLComment    = #6a7090
